<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Duo — camera</title>

<!--
  Live camera view, on its own relay and its own port (8789).

  03-architecture.md listed FrameMessage as "Not implemented" and RUNNING.md
  listed "no camera video reaches the laptop" as a known gap, both because the
  ThinkSys bridge exposed onLandmark and nothing else. The patch in
  mobile/patches changed that: captureNextFrame() JPEG-encodes the next camera
  frame, and called repeatedly it is video. This page is the other end of it.

  About the box: it is drawn from the pose landmarks, not from a separate
  object detector. That is not a shortcut, it is the better answer here — the
  pose model has already found the person, to the joint, so a box around the
  visible landmarks is exact and costs nothing. A second detection model would
  mean another download, another thing to run on a phone that is already doing
  inference, and a looser box.

  Deliberately its own page and its own relay. The session viewer on 8787
  carries the skeleton the pitch depends on, and this stream is megabytes of
  JPEG; they do not share a socket. Zero dependencies, no build step.
-->
<style>
  :root {
    --bg: #08090c;
    --ink: #edeae4;
    --dim: #767b85;
    --faint: #474c56;
    --line: rgba(237, 234, 228, 0.09);
    --bone: #e8dfd0;
    --good: #84a96c;
    --warn: #dda85c;

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text",
            "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", "Segoe UI Mono",
            Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.55 var(--sans);
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 60px;
    padding: 0 22px;
    border-bottom: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand b { font: italic 400 24px/1 var(--serif); }
  .brand span {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--dim); padding-left: 12px; border-left: 1px solid var(--line);
  }

  .verdict {
    font: 400 13px/1 var(--sans);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--faint);
    transition: color 200ms ease;
  }
  .verdict.seen { color: var(--good); }

  .bar-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

  button {
    font: 500 12px/1 var(--sans);
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 13px;
    cursor: pointer;
    transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
  }
  button:hover { color: var(--ink); border-color: rgba(237,234,228,0.16); }
  button[aria-pressed="true"] { color: var(--bg); background: var(--bone); border-color: var(--bone); }

  /*
   * Invisible on purpose: see the script section for why. Sized generously
   * (a quarter of the view, not a pixel-precise corner) because the point is
   * to be un-labelled, not hard to physically hit — a demo operator should
   * not need pixel accuracy under stage pressure.
   */
  .fallTriggerHotspot {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 30%;
    height: 30%;
    min-width: 120px;
    min-height: 120px;
    z-index: 1000;
    pointer-events: auto;
  }

  .status {
    display: flex; align-items: center; gap: 9px;
    margin-left: 8px; padding-left: 14px;
    border-left: 1px solid var(--line);
    font-size: 11.5px; color: var(--dim); white-space: nowrap;
  }
  .eye { position: relative; width: 13px; height: 13px; flex-shrink: 0; }
  .eye::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--faint); transition: background 200ms ease; }
  .eye.live::before { background: var(--good); }
  .eye.waiting::before { background: var(--warn); }

  main { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  .curtain {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    text-align: center;
    background: rgba(8, 9, 12, 0.86);
  }
  .curtain[hidden] { display: none; }
  .curtain strong { font: italic 400 26px/1.2 var(--serif); }
  .curtain p { margin: 0; color: var(--dim); max-width: 520px; font-size: 13px; }
  .curtain code {
    font: 400 11.5px/1 var(--mono); color: var(--faint);
    border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px;
  }

  .readout {
    position: absolute; left: 22px; bottom: 18px;
    display: flex; gap: 22px;
    font: 400 10.5px/1.9 var(--mono);
    color: var(--faint);
    pointer-events: none;
  }
  .readout b { color: var(--dim); font-weight: 400; }

  .distance {
    position: absolute; left: 22px; top: 18px;
    display: flex; flex-direction: column; gap: 3px;
    padding: 10px 13px;
    background: rgba(8, 9, 12, 0.72);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 400 11px/1.5 var(--mono);
    color: var(--dim);
    pointer-events: none;
    transition: opacity 200ms ease;
  }
  .distance[hidden] { display: none; }
  .distance .label {
    font: 500 12px/1 var(--sans);
    letter-spacing: 0.02em;
  }
  .distance .label.good { color: var(--good); }
  .distance .label.warn { color: var(--warn); }
  .distance .sub { color: var(--faint); }
</style>
</head>

<body>

<header>
  <div class="brand"><b>Duo</b><span>Camera</span></div>
  <div class="verdict" id="verdict">no person</div>
  <div class="bar-right">
    <button id="box" aria-pressed="true" title="Draw the detection box around the person.">Box</button>
    <button id="skeleton" aria-pressed="false" title="Overlay the pose skeleton on the video.">Skeleton</button>
    <button id="follow" aria-pressed="false" title="Crop the view to the person, tracking their shape as they move.">Follow</button>
    <div class="status">
      <span class="eye" id="dot"></span>
      <span id="statusText">connecting…</span>
    </div>
  </div>
</header>

<main>
  <canvas id="canvas"></canvas>
  <div id="fallTriggerHotspot" class="fallTriggerHotspot"></div>
  <div class="distance" id="distance" hidden>
    <span class="sub">distance (estimated)</span>
    <span class="label" id="distanceLabel"></span>
    <span class="sub" id="distanceSub"></span>
  </div>
  <div class="readout" id="readout"></div>
  <div class="curtain" id="curtain">
    <strong id="curtainTitle">Waiting for the camera</strong>
    <p id="curtainBody">
      Start the camera relay with <code>node viewer/relay.js --port 8789</code>,
      forward it with <code>adb reverse tcp:8789 tcp:8789</code>, and open the
      Duo app. The camera runs from the idle screen.
    </p>
    <code id="wsUrl"></code>
  </div>
</main>

<script>
'use strict';

/*
 * Duo camera view — Person C.
 *
 * Reads FrameMessage (JPEG) and LandmarkMessage from a relay of its own, draws
 * the video, and boxes the person. It sends nothing and never touches the
 * session stream on 8787.
 */

function viewerUrl() {
  const override = new URLSearchParams(location.search).get('ws');
  if (override) return override;
  if (location.protocol === 'file:') return 'ws://localhost:8789/viewer';
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${scheme}://${location.host}/viewer`;
}

const WS_URL = viewerUrl();
document.getElementById('wsUrl').textContent = WS_URL;

const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const curtain = document.getElementById('curtain');
const curtainTitle = document.getElementById('curtainTitle');
const curtainBody = document.getElementById('curtainBody');
const verdictEl = document.getElementById('verdict');
const readoutEl = document.getElementById('readout');
const distanceEl = document.getElementById('distance');
const distanceLabelEl = document.getElementById('distanceLabel');
const distanceSubEl = document.getElementById('distanceSub');

let socket = null;
let reconnectDelay = 500;

let landmarks = null;
let lastLandmarkAt = 0;

/*
 * Frames are decoded into an Image and swapped in only once decoding has
 * finished. Painting straight from the base64 string would mean a half-decoded
 * picture on screen; holding the previous frame until the next one is ready is
 * what makes 5fps read as slightly choppy video rather than as flicker.
 */
let currentImage = null;
let pendingImage = null;
let lastFrameAt = 0;
let frameCount = 0;
let frameBytes = 0;
let frameTicks = [];

function setStatus(kind, text) {
  dot.className = 'eye' + (kind ? ' ' + kind : '');
  statusText.textContent = text;
}

function connect() {
  setStatus('waiting', 'connecting…');
  socket = new WebSocket(WS_URL);

  socket.onopen = () => {
    reconnectDelay = 500;
    setStatus('waiting', 'waiting for phone');
  };

  socket.onmessage = (event) => {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch {
      return;
    }

    if (msg.type === 'landmarks' && Array.isArray(msg.landmarks)) {
      landmarks = msg.landmarks;
      lastLandmarkAt = performance.now();
      setStatus('live', 'live');
      return;
    }

    if (msg.type === 'frame' && typeof msg.jpeg === 'string') {
      frameCount++;
      frameBytes += msg.jpeg.length;
      frameTicks.push(performance.now());

      // Only one decode in flight. At 5fps this never queues, but a slow
      // machine must drop frames rather than build a backlog it can never
      // catch up on.
      if (pendingImage) return;
      const image = new Image();
      pendingImage = image;
      image.onload = () => {
        currentImage = image;
        lastFrameAt = performance.now();
        pendingImage = null;
      };
      image.onerror = () => {
        pendingImage = null;
      };
      image.src = 'data:image/jpeg;base64,' + msg.jpeg;
      setStatus('live', 'live');
    }
  };

  socket.onclose = () => {
    setStatus('', 'relay offline');
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 8000);
  };

  socket.onerror = () => {};
}

// --- controls --------------------------------------------------------------

let showBox = true;
let showSkeleton = false;

const btnBox = document.getElementById('box');
btnBox.onclick = () => {
  showBox = !showBox;
  btnBox.setAttribute('aria-pressed', String(showBox));
};

const btnSkeleton = document.getElementById('skeleton');
btnSkeleton.onclick = () => {
  showSkeleton = !showSkeleton;
  btnSkeleton.setAttribute('aria-pressed', String(showSkeleton));
};

// On by default: a caretaker opening this page wants a camera that follows
// the person automatically, the way a vlogger's tracking shot does, not a
// feature they have to discover and switch on first.
let followPerson = true;
const btnFollow = document.getElementById('follow');
btnFollow.setAttribute('aria-pressed', 'true');
btnFollow.onclick = () => {
  followPerson = !followPerson;
  btnFollow.setAttribute('aria-pressed', String(followPerson));
};

// --- demo fall trigger -------------------------------------------------------
//
// Sends {type:'simulate_fall'} on this page's own socket. The relay forwards
// it to every connected phone (relay.js), and the phone's transport treats it
// exactly like a real detection reaching useFallAlert — same countdown, same
// spoken warning, same caregiver alert if configured — without touching the
// real FallDetector's state. See WebSocketClientTransport.onSimulateFall for
// the trust boundary this crosses: the phone accepts nothing here beyond
// "fire", the same posture as the note and snapshot-request messages already
// sent from the other viewer page.
//
// Hidden and unconfirmed on purpose, the same posture as the phone's own dev
// overlay (tap the top-left corner three times) — a control meant for
// whoever is running the demo, not something a caretaker should stumble into
// while watching the feed. Three taps close together in the bottom-right
// corner fire it immediately, no dialog.
const FALL_TRIGGER_TAPS = 3;
const FALL_TRIGGER_WINDOW_MS = 1500;
let fallTriggerTaps = 0;
let fallTriggerLastTapAt = 0;

document.getElementById('fallTriggerHotspot').addEventListener('click', () => {
  const now = performance.now();
  const withinWindow = now - fallTriggerLastTapAt <= FALL_TRIGGER_WINDOW_MS;
  fallTriggerLastTapAt = now;
  fallTriggerTaps = withinWindow ? fallTriggerTaps + 1 : 1;
  if (fallTriggerTaps < FALL_TRIGGER_TAPS) return;
  fallTriggerTaps = 0;

  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({ type: 'simulate_fall' }));
});

// --- the person box --------------------------------------------------------

const SKELETON = [
  [11, 12], [11, 23], [12, 24], [23, 24],
  [11, 13], [13, 15], [12, 14], [14, 16],
  [23, 25], [25, 27], [24, 26], [26, 28],
  [0, 11], [0, 12],
];

const usable = (p) =>
  Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]);

/**
 * The bounding box, from the landmarks rather than from a second model.
 *
 * The pose model has already located the person joint by joint, so the extent
 * of the visible landmarks IS the person — tighter than a detector box, and
 * free. Points outside the frame are dropped rather than clamped: BlazePose
 * extrapolates past the edges of the image, and letting those through would
 * inflate the box around a body part the camera cannot actually see.
 */
function personBox() {
  if (!landmarks) return null;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  let seen = 0;

  for (const point of landmarks) {
    if (!usable(point)) continue;
    const [x, y] = point;
    if (x < -0.05 || x > 1.05 || y < -0.05 || y > 1.05) continue;
    seen++;
    if (x < minX) minX = x;
    if (y < minY) minY = y;
    if (x > maxX) maxX = x;
    if (y > maxY) maxY = y;
  }

  // A handful of stray points is not a person. Requiring a real cluster stops
  // the box flickering into existence around noise.
  if (seen < 8) return null;

  // A little headroom, because the top landmark is the nose and a person has a
  // skull above it that the pose model never reports.
  const padX = (maxX - minX) * 0.08;
  const padTop = (maxY - minY) * 0.16;
  const padBottom = (maxY - minY) * 0.04;

  return {
    x: Math.max(0, minX - padX),
    y: Math.max(0, minY - padTop),
    w: Math.min(1, maxX + padX) - Math.max(0, minX - padX),
    h: Math.min(1, maxY + padBottom) - Math.max(0, minY - padTop),
    points: seen,
  };
}

// --- framing / estimated distance -------------------------------------------

/*
 * An ESTIMATE, not a measurement. The landmark stream sends [x, y] only — z
 * and visibility are dropped at the source (see streamPublisher.ts) — and
 * there is no per-device camera calibration (real focal length, sensor size).
 * So this assumes a fixed average person height and a fixed camera vertical
 * field of view, then inverts the pinhole projection:
 *
 *   observed_height_fraction = real_height / (2 * distance * tan(vFOV / 2))
 *   distance = real_height / (2 * observed_height_fraction * tan(vFOV / 2))
 *
 * Both assumptions are guesses (adult average height, a typical phone rear
 * camera's vertical FOV), so this reads as "about 1.6m" and is labelled
 * "estimated" in the UI rather than shown as a precise figure. A taller or
 * shorter person, or a different camera, shifts the true number without
 * changing anything this code can detect.
 */
const ASSUMED_PERSON_HEIGHT_M = 1.70;
const ASSUMED_VERTICAL_FOV_DEG = 70;
const HALF_FOV_TAN = Math.tan((ASSUMED_VERTICAL_FOV_DEG * Math.PI) / 180 / 2);

const FRAMING_GOOD_MIN = 0.42;
const FRAMING_GOOD_MAX = 0.82;

function estimatedDistanceMeters(boxHeightFraction) {
  if (boxHeightFraction <= 0) return null;
  return ASSUMED_PERSON_HEIGHT_M / (2 * boxHeightFraction * HALF_FOV_TAN);
}

function framingFromBox(box) {
  if (!box) return null;
  const fill = Math.round(box.h * 100);
  const distance = estimatedDistanceMeters(box.h);
  const tone = box.h < FRAMING_GOOD_MIN || box.h > FRAMING_GOOD_MAX ? 'warn' : 'good';
  return { distance, fill, tone };
}

// --- follow (tight crop to the person) --------------------------------------

/*
 * The phone does not move — it is a fixed sensor. "Follow" crops the frame
 * down to just the person: the crop's own shape is the person's silhouette
 * plus a small margin, not a fixed camera-shaped window that merely pans and
 * zooms. Standing normally, arms at the sides, that shape is narrow and tall
 * — that is not a bug to correct for here, it is the point: no unwanted
 * space stays in frame on either side. Stepping back, moving sideways, or
 * spreading their arms all change what the crop looks like, because it always
 * reflects only the current extent of the person, in both position and
 * shape. On by default, so opening the page already gives a camera that
 * follows the person rather than a feature to discover.
 *
 * The crop is smoothed rather than snapped straight to the box because the
 * box itself jitters frame to frame with landmark noise; without smoothing
 * this reads as the frame shaking instead of tracking.
 */
const FOLLOW_SMOOTHING = 0.15; // lower = smoother/slower, higher = snappier
const FOLLOW_PAD = 0.18;       // margin kept around the person, as a fraction of their size on each side
const FOLLOW_MIN_SPAN = 0.08;  // never crop tighter than this fraction of the frame, per axis — a floor against
                                // a person filling only a couple of pixels (a landmark misdetection), not a
                                // "keep it watchable" cap

let followCrop = null; // { x, y, w, h } in normalised 0..1 source-frame coordinates — exactly what gets drawn

function targetCrop(box) {
  const padX = box.w * FOLLOW_PAD;
  const padY = box.h * FOLLOW_PAD;
  const w = Math.max(FOLLOW_MIN_SPAN, Math.min(1, box.w + padX * 2));
  const h = Math.max(FOLLOW_MIN_SPAN, Math.min(1, box.h + padY * 2));
  const cx = box.x + box.w / 2;
  const cy = box.y + box.h / 2;
  return {
    x: Math.min(Math.max(0, cx - w / 2), 1 - w),
    y: Math.min(Math.max(0, cy - h / 2), 1 - h),
    w,
    h,
  };
}

function updateFollowCrop(box) {
  if (!box) return;
  const target = targetCrop(box);
  if (!followCrop) {
    followCrop = target;
    return;
  }
  const k = FOLLOW_SMOOTHING;
  followCrop = {
    x: followCrop.x + (target.x - followCrop.x) * k,
    y: followCrop.y + (target.y - followCrop.y) * k,
    w: followCrop.w + (target.w - followCrop.w) * k,
    h: followCrop.h + (target.h - followCrop.h) * k,
  };
}

// --- drawing ---------------------------------------------------------------

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
}
new ResizeObserver(resize).observe(canvas);
resize();

function fitRect(w, h, aspect) {
  let cw = w, ch = w / aspect;
  if (ch > h) { ch = h; cw = h * aspect; }
  return { x: (w - cw) / 2, y: (h - ch) / 2, w: cw, h: ch };
}

function draw() {
  requestAnimationFrame(draw);

  const w = canvas.width;
  const h = canvas.height;
  const dpr = window.devicePixelRatio || 1;

  ctx.clearRect(0, 0, w, h);

  const videoStale = performance.now() - lastFrameAt > 3000;
  const poseStale = performance.now() - lastLandmarkAt > 2000;

  const box = poseStale ? null : personBox();

  if (followPerson && box) {
    updateFollowCrop(box);
  } else if (!followPerson) {
    followCrop = null;
  }

  const crop = followPerson && followCrop ? followCrop : { x: 0, y: 0, w: 1, h: 1 };

  // With Follow off, the rect fits the video's native aspect ratio, same as
  // always. With Follow on, the rect is fit to the CROP's own aspect ratio —
  // that is the whole point of "cut out the unwanted space": the visible
  // frame's shape follows the person's actual silhouette, narrow standing
  // normally, wider with arms out, rather than staying one fixed camera shape
  // and only panning/zooming within it.
  const sourceAspect = currentImage ? currentImage.width / currentImage.height : 16 / 9;
  const aspect = followPerson && followCrop && currentImage
    ? (crop.w * currentImage.width) / (crop.h * currentImage.height)
    : sourceAspect;
  const rect = fitRect(w, h, aspect);

  ctx.fillStyle = '#0a0b10';
  ctx.fillRect(rect.x, rect.y, rect.w, rect.h);

  if (currentImage && !videoStale) {
    ctx.drawImage(
      currentImage,
      crop.x * currentImage.width, crop.y * currentImage.height,
      crop.w * currentImage.width, crop.h * currentImage.height,
      rect.x, rect.y, rect.w, rect.h,
    );
  }

  // Map a point in the full frame's 0..1 space into the (possibly cropped) rect.
  const px = (p) => [
    rect.x + ((p[0] - crop.x) / crop.w) * rect.w,
    rect.y + ((p[1] - crop.y) / crop.h) * rect.h,
  ];

  if (box && showSkeleton) {
    ctx.strokeStyle = 'rgba(232,223,208,0.65)';
    ctx.lineWidth = 2 * dpr;
    ctx.lineCap = 'round';
    for (const [a, b] of SKELETON) {
      if (!usable(landmarks[a]) || !usable(landmarks[b])) continue;
      const [x1, y1] = px(landmarks[a]);
      const [x2, y2] = px(landmarks[b]);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  }

  if (box && showBox) {
    const [bx, by] = px([box.x, box.y]);
    const [bx2, by2] = px([box.x + box.w, box.y + box.h]);
    const bw = bx2 - bx;
    const bh = by2 - by;

    // Corner brackets rather than a full rectangle: they read as a tracking
    // box instead of a border, and they leave the face unobscured.
    const t = Math.min(bw, bh) * 0.16;
    ctx.strokeStyle = '#84a96c';
    ctx.lineWidth = 2.5 * dpr;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (const [cx, cy, sx, sy] of [
      [bx, by, 1, 1],
      [bx + bw, by, -1, 1],
      [bx, by + bh, 1, -1],
      [bx + bw, by + bh, -1, -1],
    ]) {
      ctx.moveTo(cx + sx * t, cy);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx, cy + sy * t);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(132,169,108,0.28)';
    ctx.lineWidth = 1 * dpr;
    ctx.strokeRect(bx, by, bw, bh);

    const label = 'PERSON';
    ctx.font = `${11 * dpr}px ui-monospace, monospace`;
    const textWidth = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(132,169,108,0.9)';
    ctx.fillRect(bx, by - 20 * dpr, textWidth + 14 * dpr, 18 * dpr);
    ctx.fillStyle = '#08090c';
    ctx.fillText(label, bx + 7 * dpr, by - 7 * dpr);
  }

  verdictEl.textContent = box ? 'person detected' : 'no person';
  verdictEl.className = 'verdict' + (box ? ' seen' : '');

  const framing = framingFromBox(box);
  distanceEl.hidden = !framing;
  if (framing) {
    distanceLabelEl.textContent = `~${framing.distance.toFixed(1)} m`;
    distanceLabelEl.className = 'label ' + framing.tone;
    const verdict = framing.tone === 'good' ? 'good distance' : (framing.fill > 82 ? 'too close' : 'too far');
    distanceSubEl.textContent = `estimated · ${verdict} · fills ${framing.fill}% of frame`;
  }

  const cutoff = performance.now() - 2000;
  frameTicks = frameTicks.filter((t) => t > cutoff);
  const kb = frameCount ? Math.round(frameBytes / frameCount / 1024) : 0;
  readoutEl.innerHTML =
    `<span><b>video</b> ${(frameTicks.length / 2).toFixed(1)} fps</span>` +
    `<span><b>frame</b> ~${kb} KB</span>` +
    `<span><b>landmarks</b> ${box ? box.points : 0}/33 in frame</span>`;

  const waiting = !currentImage || videoStale;
  curtain.hidden = !waiting;
  if (waiting) {
    curtainTitle.textContent = currentImage ? 'Camera stream stopped' : 'Waiting for the camera';
    curtainBody.innerHTML = currentImage
      ? 'No frames for a few seconds. The relay reconnects on its own.'
      : 'Start the camera relay with <code>node viewer/relay.js --port 8789</code>, forward it with <code>adb reverse tcp:8789 tcp:8789</code>, and open the Duo app. The camera runs from the idle screen.';
  }
}

requestAnimationFrame(draw);
connect();
</script>

</body>
</html>
